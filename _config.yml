# Hexo 站点配置（由 goodniuniu.github.io 现网 HTML 反向还原）
title: Time Stamp
subtitle: ''
description: ''
author: goodniuniu
language: zh-Hans
timezone: ''

url: https://www.goodniuniu.com
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  tab_replace: ''

theme: next

# NexT 5.1.4 (Gemini) 主题配置——由现网推断，按需微调
theme_config:
  scheme: Gemini
  language: zh-Hans
  menu:
    home: /||home
    tags: /tags/||tags
    categories: /categories/||th
    archives: /archives/||archive
  menu_icons:
    enable: true
  sidebar:
    position: left
    display: post
    b2t: true
    scrollpercent: true
    onmobile: false
  fancybox: true
  tabs:
    enable: true
    transition:
      tabs: false
      labels: true
    border_radius: 0
  motion:
    enable: true
  footer:
    theme:
      enable: true

# 部署已由 GitHub Actions 自动完成（见 .github/workflows/deploy.yml）
# 使用 peaceiris/actions-gh-pages 将 public/ 发布到 gh-pages 分支，
# 再在仓库 Settings → Pages 中将 Source 设为 gh-pages 分支。
