# Hexo 站点配置（由 goodniuniu.github.io 现网 HTML 反向还原）
title: Time Stamp
subtitle: ''
description: ''
author: goodniuniu
language: zh-CN
timezone: ''

url: https://www.goodniuniu.com
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  tab_replace: ''

theme: next

# NexT 8 (Gemini) 主题配置
theme_config:
  scheme: Gemini
  menu:
    home: / || fa fa-home
    tags: /tags/ || fa fa-tags
    categories: /categories/ || fa fa-th
    archives: /archives/ || fa fa-archive
  sidebar:
    position: left
    display: post
  back2top:
    enable: true
    sidebar: true
    scrollpercent: true
  fancybox: true
  motion:
    enable: true
    async: false
    duration: 200
  footer:
    powered: true

# 部署已由 GitHub Actions 自动完成（见 .github/workflows/deploy.yml）
# 使用 peaceiris/actions-gh-pages 将 public/ 发布到 gh-pages 分支，
# 再在仓库 Settings → Pages 中将 Source 设为 gh-pages 分支。
# 如需本地手动部署，可取消下方注释（会推送到 master）：
